<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
  :root{--blue:#0B4F9E;--magenta:#B01C83;--purple:#5B2C83;--yellow:#F5B11A;--green:#1E8C5A;--ink:#121933;--muted:#596182;--line:#E0E4EF;--soft:#F2F4FA}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:17px;line-height:1.7}
  .bar{height:8px;background:linear-gradient(270deg,var(--blue) 0 25%,var(--magenta) 25% 50%,var(--purple) 50% 75%,var(--yellow) 75%)}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:18px}
  header b{font-family:Alexandria,sans-serif;color:var(--blue);font-size:15px;letter-spacing:.06em}
  h1{font-family:Alexandria,sans-serif;font-size:24px;margin:4px 0 0;line-height:1.4}
  .note{color:var(--muted);font-size:14px;margin:0}
  .q{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px}
  .q p{margin:0;font-weight:600}
  .opt{display:block;text-align:right;width:100%;font:inherit;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:12px 16px;color:var(--ink);cursor:pointer}
  .opt.sel{border-color:var(--blue);background:#E6EFFA}
  .opt.ok{border-color:var(--green);background:#E3F4EC}
  .opt.no{border-color:var(--magenta);background:#FBE8F4}
  .why{font-size:14px;color:var(--muted);margin:0}
  button.send{font-family:Alexandria,sans-serif;font-size:18px;border:0;border-radius:999px;padding:14px;background:var(--blue);color:#fff;cursor:pointer}
  button.send:disabled{opacity:.5}
  .msg{border-radius:16px;padding:16px;background:#FFF4D9;font-size:16px}
  .done{text-align:center;display:grid;gap:8px;padding:24px 16px;border-radius:20px;background:var(--soft)}
  .done b{font-family:Alexandria,sans-serif;font-size:40px;color:var(--blue)}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>
<div class="bar"></div>
<main id="app"></main>
<script>
  var QUIZ = <?!= quizJson ?>;
  var QUIZ_ID = <?!= JSON.stringify(quizId) ?>;
  var ROUND = <?!= JSON.stringify(round) ?>;
  var app = document.getElementById('app');
  var KEY = 'aicr:done:' + QUIZ_ID + ':' + ROUND;
  var picks = [];

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
  function header(){
    var h=el('header'); h.appendChild(el('b',null,'AICR · كرياتيفا المنيا'));
    h.appendChild(el('h1',null,QUIZ.title)); app.appendChild(h);
    app.appendChild(el('p','note','الإجابات بدون اسم. محدش هيعرف إنت اخترت إيه.'));
  }
  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

  if(!QUIZ){ app.appendChild(el('div','msg','الرابط ناقص أو غلط. اطلب من المدرب الرابط الصحيح.')); }
  else if(store(KEY)){ header(); var d=el('div','done'); d.appendChild(el('b',null,'✓')); d.appendChild(el('p',null,'إجابتك وصلت قبل كده. شكرًا!')); app.appendChild(d); }
  else build();

  function build(){
    header();
    var btns=[];
    QUIZ.questions.forEach(function(q,qi){
      var w=el('div','q'); w.appendChild(el('p',null,(qi+1)+'. '+q.q));
      btns[qi]=[];
      q.options.forEach(function(o,oi){
        var b=el('button','opt',o); b.type='button';
        b.onclick=function(){ picks[qi]=oi; btns[qi].forEach(function(x,k){ x.classList.toggle('sel',k===oi); }); check(); };
        btns[qi].push(b); w.appendChild(b);
      });
      w.appendChild(el('p','why'));
      app.appendChild(w);
    });
    var send=el('button','send','إرسال'); send.disabled=true; app.appendChild(send);
    var err=el('div','msg'); err.hidden=true; app.appendChild(err);
    function check(){ var n=0; for(var i=0;i<QUIZ.questions.length;i++) if(picks[i]!=null) n++; send.disabled=n<QUIZ.questions.length; send.textContent=send.disabled?'جاوب على كل الأسئلة ('+n+'/'+QUIZ.questions.length+')':'إرسال'; }
    check();
    send.onclick=function(){
      send.disabled=true; send.textContent='جاري الإرسال…'; err.hidden=true;
      google.script.run
        .withSuccessHandler(function(r){
          store(KEY,'1');
          btns.forEach(function(row){ row.forEach(function(b){ b.disabled=true; }); });
          send.remove();
          var d=el('div','done');
          if(r && r.correct){
            d.appendChild(el('b',null,r.score+' / '+r.total));
            d.appendChild(el('p',null,r.score>=4?'ممتاز!':'راجع الإجابات الصح تحت'));
            r.correct.forEach(function(c,qi){
              btns[qi][c].classList.add('ok');
              if(picks[qi]!==c) btns[qi][picks[qi]].classList.add('no');
              var why=app.querySelectorAll('.q')[qi].querySelector('.why'); why.textContent=r.why[qi]||'';
            });
          } else {
            d.appendChild(el('b',null,'✓')); d.appendChild(el('p',null,'شكرًا! بص على الشاشة وشوف نتيجة القاعة.'));
          }
          app.insertBefore(d, app.children[2]);
          window.scrollTo({top:0,behavior:'smooth'});
        })
        .withFailureHandler(function(e){ err.textContent=(e&&e.message)||'حصل خطأ. جرب تاني.'; err.hidden=false; send.disabled=false; send.textContent='إرسال'; })
        .submit(QUIZ_ID, ROUND, picks);
    };
  }
</script>
</body>
</html>
